<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tablero CRM | {{ config.nombre_negocio }}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#09090b">
  
  <script src="/static/vendor/tailwind.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script src="/static/vendor/lucide.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .kanban-col { min-height: calc(100vh - 220px); }
  </style>
</head>
<body class="h-full flex flex-col antialiased text-zinc-900 bg-zinc-100"
      x-data="tableroCRM()" x-init="iniciarTablero()">

  <!-- Barra de Navegación -->
  {% include "_nav.html" %}

  <!-- Asistente de Configuración Inicial (si corresponde) -->
  {% if not config.configuracion_completada %}
    {% include "_wizard.html" %}
  {% endif %}

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 pb-24 md:pb-8 flex flex-col">
    
    <!-- Barra de Herramientas Superior: Búsqueda, Totales y Nuevo Pedido -->
    <div class="mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      
      <!-- Buscador y Filtro -->
      <div class="flex items-center gap-2 flex-1 max-w-md">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" x-model="filtroTexto" placeholder="Buscar por cliente, dirección o ID..."
                 class="w-full pl-9 pr-3 py-2 bg-white rounded-xl border border-zinc-200 text-xs text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <button type="button" @click="cargarTablero()" title="Actualizar"
                class="p-2 rounded-xl bg-white border border-zinc-200 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-50 shadow-xs cursor-pointer">
          <i data-lucide="refresh-cw" class="w-4 h-4" :class="cargando ? 'animate-spin' : ''"></i>
        </button>
      </div>

      <!-- Métricas Resumen Rápido -->
      <div class="flex items-center gap-2 text-xs">
        <div class="bg-white px-3 py-2 rounded-xl border border-zinc-200 shadow-xs flex items-center gap-2">
          <span class="text-zinc-500 font-medium">Pedidos:</span>
          <span class="font-bold text-zinc-900" x-text="totalPedidos">0</span>
        </div>
        <div class="bg-white px-3 py-2 rounded-xl border border-zinc-200 shadow-xs flex items-center gap-2">
          <span class="text-zinc-500 font-medium">Total:</span>
          <span class="font-bold text-emerald-700" x-text="totalMontoARS">$ 0,00</span>
        </div>
        <a href="/pedidos" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold flex items-center gap-1.5 transition-transform active:scale-95 shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Tomar Pedido</span>
        </a>
      </div>

    </div>

    <!-- Tablero Kanban Horizontal con Scroll Suave -->
    <div class="flex-1 overflow-x-auto pb-4">
      <div class="flex gap-4 min-w-[900px] items-start">
        
        <template x-for="col in columnas" :key="col.id">
          <div class="w-72 shrink-0 bg-zinc-200/60 rounded-2xl p-3 border border-zinc-200 flex flex-col kanban-col"
               @dragover.prevent
               @drop="soltarTarjeta($event, col.id)">
            
            <!-- Encabezado de Columna -->
            <div class="flex items-center justify-between mb-3 px-1">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full" :class="col.colorDot"></span>
                <h3 class="text-xs font-bold text-zinc-800 uppercase tracking-wide" x-text="col.titulo"></h3>
              </div>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-white text-zinc-700 border border-zinc-200"
                    x-text="filtrarItems(col.id).length"></span>
            </div>

            <!-- Lista de Tarjetas de la Columna -->
            <div class="flex-1 space-y-2.5 overflow-y-auto pr-0.5">
              <template x-for="item in filtrarItems(col.id)" :key="item.id">
                <div class="bg-white p-3.5 rounded-xl border border-zinc-200/90 shadow-xs hover:shadow-md transition-shadow cursor-grab active:cursor-grabbing group relative"
                     draggable="true"
                     @dragstart="iniciarArrastre($event, item.id)">
                  
                  <!-- Cabecera de la Tarjeta: ID y Fecha/Hora -->
                  <div class="flex items-center justify-between text-[11px] text-zinc-400 mb-1.5 font-mono">
                    <span class="font-bold text-zinc-600">#<span x-text="item.id"></span></span>
                    <span x-text="item.fecha_formateada || item.fecha"></span>
                  </div>

                  <!-- Nombre del Cliente y Teléfono -->
                  <div class="mb-2">
                    <h4 class="text-xs font-bold text-zinc-900 group-hover:text-amber-600 transition-colors"
                        x-text="item.cliente_nombre"></h4>
                    <p class="text-[11px] text-zinc-500 truncate" x-text="item.cliente_direccion || 'Sin dirección cargada'"></p>
                  </div>

                  <!-- Detalle de Ítems / Bultos -->
                  <div class="text-[11px] text-zinc-600 bg-zinc-50 p-2 rounded-lg border border-zinc-100 mb-2.5 space-y-1">
                    <template x-for="prod in (item.items || []).slice(0, 2)" :key="prod.id || prod.nombre">
                      <div class="flex justify-between truncate">
                        <span x-text="prod.cantidad + 'x ' + prod.nombre"></span>
                        <span class="font-mono text-zinc-500" x-text="formatearARS(prod.subtotal)"></span>
                      </div>
                    </template>
                    <div x-show="(item.items || []).length > 2" class="text-[10px] text-zinc-400 font-medium">
                      + <span x-text="(item.items || []).length - 2"></span> productos más...
                    </div>
                  </div>

                  <!-- Monto Total y Estado de Cobro -->
                  <div class="flex items-center justify-between pt-2 border-t border-zinc-100">
                    <div>
                      <span class="text-[10px] text-zinc-400 font-semibold block leading-none">TOTAL ARS</span>
                      <span class="text-xs font-black text-slate-900 font-mono" x-text="formatearARS(item.total)"></span>
                    </div>

                    <!-- Badge ROJO solo si tiene deuda. Sin badge redundante de 'al día' -->
                    <template x-if="item.saldo_pendiente > 0">
                      <span class="px-2 py-0.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-[10px] font-bold">
                        Debe <span x-text="formatearARS(item.saldo_pendiente)"></span>
                      </span>
                    </template>
                  </div>

                  <!-- Botones de Acción Rápida (WhatsApp Cero Rombos + Mover Etapa + Ver) -->
                  <div class="mt-3 pt-2 border-t border-zinc-100 flex items-center justify-between gap-1">
                    
                    <!-- WhatsApp en 1 toque (Cero Rombos) -->
                    <a :href="generarLinkWhatsApp(item)" target="_blank"
                       class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-[11px] font-bold flex items-center gap-1 transition-colors"
                       title="Avisar por WhatsApp (Sin emojis ni rombos)">
                      <i data-lucide="message-circle" class="w-3.5 h-3.5 text-emerald-600"></i>
                      <span>WhatsApp</span>
                    </a>

                    <div class="flex items-center gap-1">
                      <!-- Ver Detalles -->
                      <button type="button" @click="abrirDetalle(item)"
                              class="p-1.5 rounded-lg bg-zinc-50 hover:bg-zinc-100 text-zinc-600 border border-zinc-200 cursor-pointer"
                              title="Ver detalle del pedido">
                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                      </button>

                      <!-- Avanzar Etapa -->
                      <button type="button" @click="avanzarEtapa(item)"
                              class="p-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-amber-400 cursor-pointer"
                              title="Avanzar a la siguiente etapa">
                        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>

                  </div>

                </div>
              </template>

              <!-- Estado Vacío en Columna -->
              <div x-show="filtrarItems(col.id).length === 0"
                   class="text-center py-8 text-zinc-400 text-xs">
                Sin pedidos en esta etapa
              </div>
            </div>

          </div>
        </template>

      </div>
    </div>

  </main>

  <!-- Modal Detalle de Pedido -->
  <div x-show="modalDetalle" x-cloak
       class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-zinc-200 max-h-[90vh] flex flex-col"
         @click.outside="modalDetalle = false">
      
      <div class="flex items-center justify-between pb-3 border-b border-zinc-100">
        <div>
          <h3 class="font-bold text-zinc-900 text-sm">
            Pedido #<span x-text="pedidoSeleccionado?.id"></span> - <span x-text="pedidoSeleccionado?.cliente_nombre"></span>
          </h3>
          <p class="text-xs text-zinc-500" x-text="pedidoSeleccionado?.cliente_direccion || 'Sin dirección'"></p>
        </div>
        <button type="button" @click="modalDetalle = false" class="text-zinc-400 hover:text-zinc-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto py-4 space-y-4">
        <!-- Estado Actual & Selector -->
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 uppercase mb-1">Cambiar Estado</label>
          <select x-model="pedidoSeleccionado.estado" @change="guardarCambioEstado()"
                  class="w-full px-3 py-2 bg-zinc-50 rounded-xl border border-zinc-200 text-xs font-bold text-zinc-800">
            <template x-for="col in columnas" :key="col.id">
              <option :value="col.id" x-text="col.titulo"></option>
            </template>
          </select>
        </div>

        <!-- Desglose de Productos -->
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 uppercase mb-1">Ítems / Servicios</label>
          <div class="border border-zinc-200 rounded-xl overflow-hidden divide-y divide-zinc-100 text-xs">
            <template x-for="prod in pedidoSeleccionado?.items || []" :key="prod.id">
              <div class="p-2.5 flex justify-between items-center bg-white">
                <div>
                  <span class="font-bold text-zinc-800" x-text="prod.nombre"></span>
                  <div class="text-[11px] text-zinc-500">
                    <span x-text="prod.cantidad"></span> x <span x-text="formatearARS(prod.precio_unitario)"></span>
                  </div>
                </div>
                <span class="font-mono font-bold text-zinc-900" x-text="formatearARS(prod.subtotal)"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Cobros y Saldo -->
        <div class="bg-zinc-50 p-3 rounded-xl border border-zinc-200 text-xs space-y-1.5">
          <div class="flex justify-between">
            <span class="text-zinc-500">Total Pedido:</span>
            <span class="font-mono font-bold text-zinc-900" x-text="formatearARS(pedidoSeleccionado?.total || 0)"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-zinc-500">Cobrado:</span>
            <span class="font-mono font-bold text-emerald-600" x-text="formatearARS(pedidoSeleccionado?.monto_cobrado || 0)"></span>
          </div>
          <div class="flex justify-between pt-1 border-t border-zinc-200">
            <span class="font-bold text-zinc-800">Saldo Pendiente:</span>
            <span class="font-mono font-black" :class="(pedidoSeleccionado?.saldo_pendiente || 0) > 0 ? 'text-rose-600' : 'text-zinc-700'"
                  x-text="formatearARS(pedidoSeleccionado?.saldo_pendiente || 0)"></span>
          </div>
        </div>

        <!-- Observaciones -->
        <div x-show="pedidoSeleccionado?.observaciones">
          <label class="block text-[11px] font-bold text-zinc-500 uppercase mb-1">Observaciones</label>
          <div class="p-2.5 rounded-xl bg-zinc-50 border border-zinc-200 text-xs text-zinc-700" x-text="pedidoSeleccionado?.observaciones"></div>
        </div>
      </div>

      <!-- Pie del Modal: WhatsApp y Cerrar -->
      <div class="pt-3 border-t border-zinc-100 flex items-center justify-between gap-2">
        <a :href="generarLinkWhatsApp(pedidoSeleccionado)" target="_blank"
           class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center gap-2 shadow-xs transition-colors">
          <i data-lucide="message-circle" class="w-4 h-4"></i>
          <span>Enviar Notificación WhatsApp</span>
        </a>
        <button type="button" @click="modalDetalle = false"
                class="px-4 py-2.5 rounded-xl border border-zinc-200 text-xs font-bold text-zinc-700 hover:bg-zinc-50">
          Cerrar
        </button>
      </div>

    </div>
  </div>

  <script>
    function tableroCRM() {
      return {
        cargando: false,
        filtroTexto: '',
        pedidos: [],
        arrastrandoId: null,
        modalDetalle: false,
        pedidoSeleccionado: null,

        // Configuración de Columnas según perfil
        perfil: '{{ config.rubro_perfil }}' || 'preventista',
        columnas: [],

        iniciarTablero() {
          this.definirColumnas();
          this.cargarTablero();
          this.$nextTick(() => lucide.createIcons());
        },

        definirColumnas() {
          if (this.perfil === 'preventista') {
            this.columnas = [
              { id: 'nuevo', titulo: 'Nuevo Pedido', colorDot: 'bg-blue-500' },
              { id: 'en_camino', titulo: 'En Reparto', colorDot: 'bg-amber-500' },
              { id: 'entregado', titulo: 'Entregado', colorDot: 'bg-purple-500' },
              { id: 'cobrado', titulo: 'Cobrado / Listo', colorDot: 'bg-emerald-500' }
            ];
          } else {
            this.columnas = [
              { id: 'contacto', titulo: 'Contacto Inicial', colorDot: 'bg-blue-500' },
              { id: 'presupuesto', titulo: 'Presupuestado', colorDot: 'bg-amber-500' },
              { id: 'negociacion', titulo: 'En Negociación', colorDot: 'bg-purple-500' },
              { id: 'aprobado', titulo: 'Aprobado / Activo', colorDot: 'bg-emerald-500' }
            ];
          }
        },

        async cargarTablero() {
          this.cargando = true;
          try {
            const res = await fetch('/api/pedidos');
            if (res.ok) {
              this.pedidos = await res.json();
            }
          } catch (e) {
            console.warn('Modo Offline o error de red:', e);
            // Recuperar de almacenamiento local si existe
            const guardados = localStorage.getItem('crm_pedidos');
            if (guardados) {
              this.pedidos = JSON.parse(guardados);
            }
          } finally {
            this.cargando = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        filtrarItems(colId) {
          const q = this.filtroTexto.trim().toLowerCase();
          return this.pedidos.filter(p => {
            const coincideCol = (p.estado || '').toLowerCase() === colId.toLowerCase();
            if (!coincideCol) return false;
            if (!q) return true;
            return (p.cliente_nombre || '').toLowerCase().includes(q) ||
                   (p.cliente_direccion || '').toLowerCase().includes(q) ||
                   (p.id || '').toString().includes(q);
          });
        },

        get totalPedidos() {
          return this.pedidos.length;
        },

        get totalMontoARS() {
          const suma = this.pedidos.reduce((acc, p) => acc + (p.total || 0), 0);
          return this.formatearARS(suma);
        },

        formatearARS(val) {
          const num = Number(val) || 0;
          return '$ ' + num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        iniciarArrastre(event, id) {
          this.arrastrandoId = id;
          event.dataTransfer.setData('text/plain', id);
        },

        async soltarTarjeta(event, nuevoEstado) {
          const id = event.dataTransfer.getData('text/plain') || this.arrastrandoId;
          if (!id) return;

          const item = this.pedidos.find(p => p.id == id);
          if (item && item.estado !== nuevoEstado) {
            item.estado = nuevoEstado;
            await this.actualizarEstadoEnServidor(item.id, nuevoEstado);
          }
        },

        async avanzarEtapa(item) {
          const estados = this.columnas.map(c => c.id);
          const idx = estados.indexOf(item.estado);
          if (idx !== -1 && idx < estados.length - 1) {
            item.estado = estados[idx + 1];
            await this.actualizarEstadoEnServidor(item.id, item.estado);
          }
        },

        async actualizarEstadoEnServidor(id, estado) {
          try {
            await fetch(`/api/pedidos/${id}/estado`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ estado })
            });
            // Respaldar en localStorage
            localStorage.setItem('crm_pedidos', JSON.stringify(this.pedidos));
          } catch (e) {
            console.error('Error al actualizar estado:', e);
          } finally {
            this.$nextTick(() => lucide.createIcons());
          }
        },

        abrirDetalle(item) {
          this.pedidoSeleccionado = JSON.parse(JSON.stringify(item));
          this.modalDetalle = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async guardarCambioEstado() {
          if (!this.pedidoSeleccionado) return;
          const orig = this.pedidos.find(p => p.id == this.pedidoSeleccionado.id);
          if (orig) orig.estado = this.pedidoSeleccionado.estado;
          await this.actualizarEstadoEnServidor(this.pedidoSeleccionado.id, this.pedidoSeleccionado.estado);
        },

        generarLinkWhatsApp(pedido) {
          if (!pedido) return '#';
          const tel = (pedido.cliente_telefono || '').replace(/\D/g, '');
          const telLimpio = tel.startsWith('54') ? tel : (tel.startsWith('9') ? '54' + tel : '549' + tel);

          // REGLA GEMINI: CERO ROMBOS - CERO EMOJIS EN WHATSAPP
          let texto = '*AVISO DE PEDIDO*' + '%0A';
          texto += '*' + (('{{ config.nombre_negocio }}' || 'Mini CRM')).toUpperCase() + '*%0A%0A';
          texto += 'Hola *' + encodeURIComponent(pedido.cliente_nombre || 'Cliente') + '*, te compartimos el detalle de tu pedido #*' + pedido.id + '*:%0A%0A';

          if (pedido.items && pedido.items.length) {
            texto += '*Detalle de productos:*%0A';
            pedido.items.forEach(it => {
              texto += '• ' + it.cantidad + 'x ' + encodeURIComponent(it.nombre) + ' - ' + encodeURIComponent(this.formatearARS(it.subtotal)) + '%0A';
            });
            texto += '%0A';
          }

          texto += '*TOTAL:* ' + encodeURIComponent(this.formatearARS(pedido.total)) + '%0A';

          if ((pedido.saldo_pendiente || 0) > 0) {
            texto += '*Saldo pendiente:* ' + encodeURIComponent(this.formatearARS(pedido.saldo_pendiente)) + '%0A';
            {% if config.alias_mp %}
            texto += '*Alias para transferir:* ' + encodeURIComponent('{{ config.alias_mp }}') + '%0A';
            {% endif %}
          } else {
            texto += '*Estado de pago:* Cobrado / Al dia%0A';
          }

          texto += '%0A*Estado:* ' + encodeURIComponent(pedido.estado || 'En preparacion') + '%0A';
          texto += 'Muchas gracias por tu compra.';

          return 'https://api.whatsapp.com/send?phone=' + telLimpio + '&text=' + texto;
        }
      }
    }
  </script>
</body>
</html>
